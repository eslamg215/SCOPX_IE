services:
  db:
    image: postgres:17-alpine
    container_name: scopx-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scopx_dev}
      POSTGRES_USER: ${POSTGRES_USER:-scopx_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - scopx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scopx_local} -d ${POSTGRES_DB:-scopx_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  scopx_pgdata:
